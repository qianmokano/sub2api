<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>系统维护 · kano API</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:min(100%,560px);padding:48px;background:#fff;border:1px solid #e4e8f0;border-radius:24px;box-shadow:0 12px 48px #10204008}.brand{font-weight:700;letter-spacing:-.04em;font-size:24px}.dot{display:inline-block;width:9px;height:9px;background:#4f6df5;border-radius:50%;margin-right:8px}h1{font-size:30px;letter-spacing:-.04em;margin:40px 0 16px}p{line-height:1.8;color:#657084;margin:12px 0}dl{padding:20px 0;margin:24px 0;border-top:1px solid #e4e8f0;border-bottom:1px solid #e4e8f0}dl div{display:flex;justify-content:space-between;gap:16px;margin:12px 0}dt{color:#657084}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}small{display:block;color:#657084;line-height:1.8}button{margin-top:24px;padding:12px 20px;border:0;border-radius:12px;background:#4f6df5;color:white;font:inherit;cursor:pointer}@media(prefers-color-scheme:dark){:root{color:#e9edf6;background:#101420;color-scheme:dark}main{background:#191f2c;border-color:#2c3546}p,dt,small{color:#a9b4c7}dl{border-color:#2c3546}}@media(max-width:480px){main{padding:28px}h1{font-size:26px}}
</style>
<main>
<div class="brand"><span class="dot"></span>kano API</div>
<h1>正在进行系统维护</h1>
<p>我们正在升级服务并验证数据。通常约需 30–45 分钟，请稍后再试。</p>
<dl><div><dt>开始时间（北京时间）</dt><dd id="started">正在获取</dd></div><div><dt>已用时</dt><dd id="elapsed">—</dd></div><div><dt>当前概况</dt><dd id="phase" role="status">维护进行中</dd></div></dl>
<small>此页面会持续检查服务状态，恢复后自动返回原页面。你的登录状态会保留。</small>
<button id="retry" type="button">检查服务状态</button>
</main>
<script>
let startedAt = null;
let checking = false;
const phases = {backup:'正在备份数据',validation:'正在验证升级',starting:'正在恢复服务',recovery:'正在恢复服务',attention:'维护仍在进行，请稍候'};
const format = new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
async function check(){
  if(checking) return;
  checking=true;
  try {
    const response=await fetch('/kano-maintenance/status',{cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(5000)});
    if(!response.ok) return;
    const status=await response.json();
    if(status.maintenance === false){location.reload();return;}
    if(status.started_at){startedAt=new Date(status.started_at);document.getElementById('started').textContent=format.format(startedAt);}
    document.getElementById('phase').textContent=phases[status.phase]||'维护进行中';
  } catch {} finally {checking=false;}
}
document.getElementById('retry').addEventListener('click',check);
setInterval(()=>{if(startedAt){const seconds=Math.max(0,Math.floor((Date.now()-startedAt.getTime())/1000));document.getElementById('elapsed').textContent=Math.floor(seconds/60)+' 分 '+seconds%60+' 秒';}},1000);
setInterval(check,3000);
check();
</script>
</html>
