name: Publish kano image

on:
  push:
    tags:
      - 'v*.*.*-[0-9]*'

permissions:
  contents: read

concurrency:
  group: kano-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'qianmokano/sub2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]; then
            echo 'Release tag must use vX.Y.Z-N with N starting at 1.' >&2
            exit 1
          fi
      - name: Verify release source belongs to fork main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Unit and integration tests
        working-directory: backend
        run: |
          make test-unit
          make test-integration
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: make test-frontend

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish fixed version image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/qianmokano/sub2api:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TYPE=kano-container
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/qianmokano/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=kano-image
          cache-to: type=gha,mode=max,scope=kano-image
      - name: Publish release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `ghcr.io/qianmokano/sub2api:%s`\n\nDigest: `%s`\n\nSee deploy/KANO-SSO.md for configuration, backup, rollback and upstream synchronization.\n' "$RELEASE_TAG" "$IMAGE_DIGEST" > "$RUNNER_TEMP/kano-release.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/kano-release.md"
